<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · social-scanner viewer</title>
  <link rel="stylesheet" href="{{ request.url_for('assets', path='viewer.css') }}?v={{ asset_version('viewer.css') }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="header-mark">
        <a href="{{ request.url_for('dashboard') }}" class="brand-link">
          <span class="brand-kicker">local archive</span>
          <span class="brand-title">social-scanner viewer</span>
        </a>
      </div>
      {% if site_nav %}
        <nav class="site-nav" aria-label="Viewer sections">
          {% for item in site_nav %}
            <a
              href="{{ item.url }}"
              class="site-nav-link {% if item.active %}is-active{% endif %}"
            >
              {{ item.label }}
            </a>
          {% endfor %}
        </nav>
      {% endif %}
      <div class="header-meta">
        <span class="header-pill">linked archive</span>
        <span class="header-pill">localhost</span>
      </div>
    </header>

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" type="button" data-lightbox-close aria-label="Close viewer">Close</button>
    <div class="lightbox-backdrop" data-lightbox-close></div>
    <div class="lightbox-body">
      <img id="lightbox-image" alt="" hidden>
      <video id="lightbox-video" controls playsinline hidden></video>
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script src="{{ request.url_for('assets', path='viewer.js') }}?v={{ asset_version('viewer.js') }}"></script>
</body>
</html>
